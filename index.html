<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Shadowfax Store Attendance</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/mark.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/attendance.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="stylesheet" href="css/responsive.css" />
<script src="assets/vendor/face-api.min.js"></script>
</head>
<body>

<div class="app-shell">

  <!-- ============ LOGIN ============ -->
  <section id="view-login" class="view">
    <div class="login-wrap">
      <div class="card login-card">
        <div class="brand">
          <span class="brand__mark-wrap"><img class="brand__mark" src="assets/logo/mark.svg" alt="" /></span>
          <span class="brand__text">
            <span class="brand__name" style="display:block;">SHADOWFAX</span>
            <span class="brand__sub">Store Attendance</span>
          </span>
        </div>

        <div id="login-error" class="login-error"></div>

        <form id="login-form">
          <div class="field-group">
            <label for="login-id">Email</label>
            <input id="login-id" type="email" placeholder="you@example.com" autocomplete="username" />
          </div>
          <div class="field-group">
            <label for="login-pass">Password</label>
            <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
        </form>

        <p class="login-hint">Works for both employee and admin accounts</p>
        <p class="login-hint"><a href="#/register">New employee? Register here →</a></p>
      </div>
    </div>
  </section>

  <!-- ============ EMPLOYEE SELF-REGISTRATION ============ -->
  <section id="view-register" class="view">
    <div class="employee-shell">
      <div class="employee-topbar">
        <div class="brand">
          <img class="brand__mark" src="assets/logo/mark.svg" alt="" style="width:24px;height:24px;" />
          <span class="brand__text">
            <span class="brand__name">SHADOWFAX</span>
            <span class="brand__sub">Employee Registration</span>
          </span>
        </div>
        <a href="#/login" class="icon-btn" style="background:transparent;border-color:#2a3552;color:#9aa5b8;" title="Cancel"></a>
      </div>
      <main id="register-main" class="employee-main"></main>
    </div>
  </section>

  <!-- ============ EMPLOYEE APP ============ -->
  <section id="view-employee" class="view">
    <div class="employee-shell">
      <div class="employee-topbar">
        <div class="brand">
          <img class="brand__mark" src="assets/logo/mark.svg" alt="" style="width:24px;height:24px;" />
          <span class="brand__text">
            <span class="brand__name">SHADOWFAX</span>
            <span class="brand__sub">Store Attendance</span>
          </span>
        </div>
        <button class="icon-btn" id="btn-employee-logout" title="Logout" style="background:transparent;border-color:#2a3552;color:#9aa5b8;"></button>
      </div>
      <main id="employee-main" class="employee-main"></main>
      <nav class="bottom-nav" id="employee-bottom-nav"></nav>
    </div>
  </section>

  <!-- ============ ADMIN APP ============ -->
  <section id="view-admin" class="view">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <img class="brand__mark" src="assets/logo/mark.svg" alt="" style="width:26px;height:26px;" />
            <span class="brand__text">
              <span class="brand__name">SHADOWFAX</span>
              <span class="brand__sub">Store Attendance</span>
            </span>
          </div>
        </div>
        <nav class="sidebar-nav" id="admin-nav"></nav>
        <div class="sidebar-footer">
          <div class="avatar avatar--sm" id="admin-avatar">AS</div>
          <div>
            <div class="sidebar-footer__name" id="admin-name">Admin User</div>
            <div class="sidebar-footer__role" id="admin-role">System Administrator</div>
          </div>
          <button class="sidebar-footer__logout" id="btn-admin-logout" title="Logout"></button>
        </div>
      </aside>
      <div class="admin-content">
        <header class="admin-topbar">
          <button class="icon-btn btn-hamburger" id="btn-admin-menu" title="Menu"></button>
          <div class="topbar-search"></div>
          <div class="topbar-right" id="admin-topbar-right"></div>
        </header>
        <main id="admin-main" class="admin-main"></main>
      </div>
      <nav class="bottom-nav" id="admin-bottom-nav"></nav>
      <div class="sidebar-backdrop" id="admin-sidebar-backdrop"></div>
    </div>
  </section>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
